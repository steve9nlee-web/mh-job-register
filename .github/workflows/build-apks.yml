name: Build role APKs

on:
  push:
    branches:
      - claude/multi-apk-contractor-types-joinu5
      - claude/modest-mayer-r1kms0
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build all three APKs
        run: gradle --no-daemon assembleRelease

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: JobRegister-Admin
          path: app/build/outputs/apk/admin/release/*.apk

      - name: Upload Contractor APK
        uses: actions/upload-artifact@v4
        with:
          name: JobRegister-Contractor
          path: app/build/outputs/apk/contractor/release/*.apk

      - name: Upload Initiator APK
        uses: actions/upload-artifact@v4
        with:
          name: JobRegister-Initiator
          path: app/build/outputs/apk/initiator/release/*.apk
